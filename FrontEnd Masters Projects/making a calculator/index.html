<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="icon" href="https://img.icons8.com/color/48/apple-calculator.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Fira+Code:wght@300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
          rel="stylesheet">
</head>
<body>
<main>
    <div id="display"></div>
    <div id="row1">
        <button class="numbers" id="clear" alt="clear screen">C</button>
        <button class="numbers" id="del" alt="delete key">⟵</button>
        <button class="operators" id="divide" alt="division operator">÷</button>
    </div>
    <div id="row2">
        <button class="numbers" id="seven" alt="numeric 7">7</button>
        <button class="numbers" id="eight" alt="numeric 8">8</button>
        <button class="numbers" id="nine" alt="numeric 9">9</button>
        <button class="operators" id="multiply" alt="multiplication operator">×</button>
    </div>
    <div id="row3">
        <button class="numbers" id="four" alt="numeric 4">4</button>
        <button class="numbers" id="five" alt="numeric 5">5</button>
        <button class="numbers" id="six" alt="numeric 6">6</button>
        <button class="operators" id="subtract" alt="subtraction operator">-</button>
    </div>
    <div id="row4">
        <button class="numbers" id="one" alt="numeric 1">1</button>
        <button class="numbers" id="two" alt="numeric 2">2</button>
        <button class="numbers" id="three" alt="numeric 3">3</button>
        <button class="operators" id="add" alt="addition operator">+</button>
    </div>
    <div id="row5">
        <button class="numbers" id="zero" alt="numeric 0">0</button>
        <button class="operators" id="equals" alt="equals operator">=</button>
    </div>
</main>
<script src="script.js" type="module"></script>
</body>
</html>
