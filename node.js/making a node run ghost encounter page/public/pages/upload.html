<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width = device-width, initial-scale=1">
    <!-- setting the title  -->
    <title>Paranormal Encounters</title>
    <!-- setting the stylesheet  -->
    <link rel="stylesheet" href="../style/style.css">
    <!-- setting the icon  -->
    <link rel="icon" href="https://img.icons8.com/3d-fluency/94/ghost.png" type="image/png">
    <!-- setting the google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Fredoka:wght@300..700&family=Gloria+Hallelujah&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Happy+Monkey&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nosifer&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Patrick+Hand&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- setting the header of the file  -->
    <header>
        <img src="../images/candle-logo.png" aria-label="a candle logo">
        <ul class="deco">
            <li><a href="../index.html">Home</a></li>
            <li><a href="read.html">Read</a></li>
            <li><a href="upload.html">Upload</a></li>
        </ul>
    </header>
    <main>
        <h1 class="deco" style="font-size: 1.25rem;">from the other side</h1>
        <h2 class="deco" style="font-size: 2rem;">add sighting</h2>
        <section>
            <form id="form">
                <div class="name form-items"> 
                    <label for="name">Title</label>
                    <input id="name" name="title" placeholder="enter your title" aria-label="please enter your name" />
                    <label for="datetime">Time/Date</label>
                    <input id="datetime" name="datetime" placeholder="dd-mm-yyyy --:--"
                    aria-label="please enter your sightings time and date" />
                    <label for="name">Location</label>
                    <input id="location" name="location" placeholder="Silchar, Assam, India"
                    aria-label="please enter your sighting location" /> 
                </div>
                <div class="details form-items"> 
                    <label for="details">Details</label>
                    <textarea id="details" name="text" placeholder="I was trying to get to sleep when..."
                    aria-label="please enter your sightings details"></textarea>
                    <div class="submit form-items"> 
                        <input id="submit" type="submit" value="SUBMIT" aria-label="submit your form" />
                    </div>
                </div>
            </form>
        </section>
    </main>
    <footer style="margin-top: 1em;">
        <p id="footer"></p>
    </footer>
    <script src="../index.js" type="module"></script>
</body>
</html>
