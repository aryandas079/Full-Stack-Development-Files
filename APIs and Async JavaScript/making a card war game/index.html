<!doctype html> 
<html lang="en"> 
    <head> 
        <meta charset="utf-8"> 
        <meta name="viewport" content="width = device-width, initial-scale = 1"> 
        <title>Card War</title> 
        <link rel="stylesheet" href="style.css"> 
        <link rel="icon" href="https://img.icons8.com/3d-fluency/94/cards.png" type="image/png"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Fredoka:wght@300..700&family=Gloria+Hallelujah&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Happy+Monkey&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Patrick+Hand&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head> 

    <body> 
        <header> 
            <p id="player-id">Player: 0</p> 
            <div> 
                <h1>Card Wars</h1> 
                <p id="remaining">remaining: </p>
            </div>
            <p id="computer-id">Computer: 0</p>
        </header> 
        <section class="information"> 
            <!-- information section --> 
            <button id="start-deck" aria-label="click button to start the deck">Start Deck</button> 
            <button id="draw-card" aria-label="click button to draw a card">Draw Card</button>
        </section>
        <section class="cards-section"> 
            <!-- cards will appear here  -->
        </section> 
        <footer> 
            <!-- footer section is this  -->
        </footer>
        <script src="script.js"></script>
    </body>
</html>
