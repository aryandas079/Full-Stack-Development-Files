<!doctype html> 
<html lang="en"> 
    <head> 
        <meta charset="utf-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <title>BlogSpace</title> 
        <link rel="stylesheet" href="style.css"> 
        <link rel="icon" href="https://img.icons8.com/ios/50/google-blog-search.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    </head> 
    <body> 
        <header> 
            <nav>
                <h1>Blogspace</h1> 
                <p>stay connected</p> 
            </nav>
        </header> 
        <section class="create-post"> 
            <form> 
                <label for="blog-title">Blog Title</label>
                <input id="blog-title" class="input-field" type="text" 
                aria-label="enter your blog-title" name="blog-title" /> 
                <label for="blog">Enter your Blog</label> 
                <textarea aria-label="enter your blog body" name="blog-body" id="blog-body"></textarea> 
                <input type="submit" value="Post" aria-label="submit your post" />
            </form>
        </section> 
        <section class="blog-posts"> 
                <!-- all the blog-posts will be here  --> 
        </section> 
        <footer> 
            <!-- footer here  -->
        </footer>
        <script src="script.js"></script>
    </body>
</html>
