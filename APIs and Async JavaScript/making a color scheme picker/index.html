<!doctype html> 
<html lang="en"> 
    <head> 
        <meta charset="utf-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Color Scheme Generator</title> 
        <link rel="stylesheet" href="style.css"> 
        <link rel="icon" href="https://img.icons8.com/color/48/color-dropper.png" type="image/png"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@300..700&family=Gloria+Hallelujah&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Happy+Monkey&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Patrick+Hand&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head> 
    <body> 
        <header><h1>Color Picker</h1></header> 
        <main> 
            <section class="color-picker-block"> 
                <input id="color" type="color" aria-label="select your color type" /> 
                <select id="dropdown" class="color-type-select" aria-label="Select color scheme mode"> 
                    <option value="monochrome">Monochrome</option> 
                    <option value="monochrome-dark">Monochrome-dark</option> 
                    <option value="monochrome-light">Monochrome-light</option> 
                    <option value="analogic">Analogic</option> 
                    <option value="complement">Complement</option> 
                    <option value="analogic-complement">Analogic-complement</option> 
                    <option value="triad">Triad</option> 
                </select> 
                <button id="submit-btn">Get Color Scheme</button> 
                <div class="display-colors"> 
                    <!-- colors will appear here  -->
                </div>
            </section>
        </main> 
        <footer> 
            <!-- footer will appear here  -->
        </footer>
        <script src="script.js"></script>
    </body>
</html>
